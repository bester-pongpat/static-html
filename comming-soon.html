<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #1A1A1A;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .coming-soon {
            text-align: center;
        }

        .coming-soon__message {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #0DB14B;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .coming-soon__accent {
            display: block;
            width: 60px;
            height: 4px;
            background-color: #FF5000;
            margin: 1.5rem auto 0;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <main class="coming-soon">
        <h1 class="coming-soon__message">Comming soon...</h1>
        <span class="coming-soon__accent"></span>
    </main>
</body>
</html>
